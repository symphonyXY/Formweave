name: Windows repository checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install isolated job dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Static and boundary tests
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -B scripts/validate.py
          python -B -m unittest discover -s tests -p "test_*.py" -v
          python -B scripts/manage.py install --dest "$env:RUNNER_TEMP/skills"
          python -B scripts/manage.py verify --dest "$env:RUNNER_TEMP/skills"
          Get-ChildItem "$env:RUNNER_TEMP/skills" -Directory | ForEach-Object { python -B scripts/validate.py --skill $_.FullName }
      - name: Qt behavior and folder build
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:QT_QPA_PLATFORM = 'offscreen'
          python -B tests/qt_probe.py
          python -B skills/formweave-build/assets/qt/build_folder.py --output "$env:RUNNER_TEMP/qt-build"
          $exe = "$env:RUNNER_TEMP/qt-build/dist/FormweaveInventory/FormweaveInventory.exe"
          $p = Start-Process $exe -ArgumentList --smoke -WindowStyle Hidden -PassThru
          if (-not $p.WaitForExit(20000) -or $p.ExitCode -ne 0) { throw 'Qt package smoke failed' }
      - name: WPF publish and smoke
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Copy-Item -Recurse skills/formweave-build/assets/wpf "$env:RUNNER_TEMP/wpf"
          dotnet publish "$env:RUNNER_TEMP/wpf/Workbench.csproj" -c Release --self-contained false -o "$env:RUNNER_TEMP/wpf-publish"
          $p = Start-Process "$env:RUNNER_TEMP/wpf-publish/FormweaveWorkbench.exe" -ArgumentList --smoke -WindowStyle Hidden -PassThru
          if (-not $p.WaitForExit(20000) -or $p.ExitCode -ne 0) { throw 'WPF smoke failed' }
      - name: Electron folder smoke
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP/electron.zip"
          Invoke-WebRequest 'https://github.com/electron/electron/releases/download/v45.2.2/electron-v45.2.2-win32-x64.zip' -OutFile $zip
          if ((Get-FileHash $zip).Hash -ne 'a234388419ccbcb18dd2feec856e4ae1832499e200837f23f8e653bd51ff3be5') { throw 'Electron digest mismatch' }
          Expand-Archive $zip "$env:RUNNER_TEMP/electron"
          Copy-Item -Recurse skills/formweave-build/assets/electron "$env:RUNNER_TEMP/electron/resources/app"
          $p = Start-Process "$env:RUNNER_TEMP/electron/electron.exe" -ArgumentList --smoke -WindowStyle Hidden -PassThru
          if (-not $p.WaitForExit(20000) -or $p.ExitCode -ne 0) { throw 'Electron smoke failed' }
